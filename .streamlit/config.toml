[theme]
font = "Inter, Segoe UI, Roboto, sans-serif"
baseFontSize = 14
base = "dark"

[theme.dark]
primaryColor = "#0EA5E9"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"

[theme.dark.sidebar]
backgroundColor = "#1E293B"
textColor = "#F1F5F9"

[theme.light]
primaryColor = "#0EA5E9"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
textColor = "#0F172A"
